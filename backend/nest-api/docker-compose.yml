services:
  postgres:
    image: postgres:16-alpine
    container_name: paroquia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: paroquia
      POSTGRES_PASSWORD: paroquia
      POSTGRES_DB: paroquia_db
    ports:
      - "5432:5432"
    volumes:
      - paroquia_pgdata:/var/lib/postgresql/data

volumes:
  paroquia_pgdata:
