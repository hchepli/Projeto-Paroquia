# ============================================================
# Sistema Paroquial - Produção
# Uso (na raiz do monorepo):
#   docker compose -f docker-compose.prod.yml --env-file .env.prod <comando>
# Veja DEPLOY.md.
# ============================================================

name: paroquia

# Rotação de log em todo serviço (o disco da VPS não enche).
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # ----------------------------------------------------------
  # Banco: SEM ports publicados. Só a rede interna enxerga.
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [interna]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 512m, cpus: '1.0' }
    logging: *logging

  # ----------------------------------------------------------
  # Migrations: uso único, NUNCA sobe com "up" (profile tools).
  #   docker compose ... run --rm migrate                    -> migrate deploy
  #   docker compose ... run --rm migrate npm run seed:prod  -> 1ª vez apenas
  # ----------------------------------------------------------
  migrate:
    build:
      context: ./backend/nest-api
      target: migrator
    image: paroquia-migrator:${IMAGE_TAG:-latest}
    profiles: [tools]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]
    logging: *logging

  # ----------------------------------------------------------
  # API: sem porta no host. Só o admin (e o Caddy, no Bloco 5) a alcança.
  # ----------------------------------------------------------
  api:
    build:
      context: ./backend/nest-api
      target: runtime
    image: paroquia-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]
    deploy:
      resources:
        limits: { memory: 512m, cpus: '1.0' }
    logging: *logging
    # healthcheck: vem do Dockerfile (/health/live)

  # ----------------------------------------------------------
  # Admin: sem porta no host. O Caddy (Bloco 5) publica 80/443.
  # IMAGE_HOSTS é lido no BUILD -> trocar de storage = rebuild.
  # ----------------------------------------------------------
  admin:
    build:
      context: ./frontend/next-admin
      args:
        IMAGE_HOSTS: ${IMAGE_HOSTS:-res.cloudinary.com}
    image: paroquia-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NEST_API_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    networks: [interna]
    deploy:
      resources:
        limits: { memory: 512m, cpus: '1.0' }
    logging: *logging
    # healthcheck: vem do Dockerfile (/api/health)

  # ----------------------------------------------------------
  # Bloco 5: Caddy entra aqui (único serviço com ports 80/443).
  # ----------------------------------------------------------
  # caddy:
  #   image: caddy:2
  #   restart: unless-stopped
  #   ports: ['80:80', '443:443']
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   networks: [interna]
  #   depends_on: [admin]

  # ----------------------------------------------------------
  # Pós-go-live: next-web entra aqui, igual ao admin.
  # ----------------------------------------------------------
  # web:
  #   build: { context: ./frontend/next-web }

volumes:
  pgdata:
  # caddy_data:
  # caddy_config:

networks:
  interna: